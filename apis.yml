aid: synchronoss
name: Synchronoss
description: >-
  Synchronoss Technologies is a global provider of white-label, operator-branded
  Personal Cloud and messaging solutions for telecommunications carriers and
  service providers. Its platform lets subscribers back up, store, manage, and
  share photos, videos, documents, contacts, messages, and call logs, delivered
  as a branded cloud experience for operators such as Verizon, AT&T, SoftBank,
  and BT. Product lines include Personal Cloud, Cloud Insurance, the engageX
  engagement suite, Advanced Messaging (RCS), and ExpenseNX financial analytics.
  Synchronoss exposes an API and SDK framework to carrier partners rather than a
  public self-serve developer portal, so this profile captures the company's
  public identity, security posture, and compliance certifications.
